<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <style>
      .bg { fill: #4AC7A8; }
      .stroke-light { fill: none; stroke: #B8F2E6; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.38; }
      .fill-light { fill: #B8F2E6; opacity: 0.28; }
      .accent { fill: #B8F2E6; opacity: 0.45; }
    </style>
  </defs>

  <!-- Base mint green background -->
  <rect width="360" height="360" class="bg" />

  <!-- Subtle textured under-glow -->
  <circle cx="180" cy="180" r="140" fill="#3eb89a" opacity="0.4" />
  <circle cx="0" cy="0" r="90" fill="#58d1b3" opacity="0.3" />
  <circle cx="360" cy="0" r="90" fill="#58d1b3" opacity="0.3" />
  <circle cx="0" cy="360" r="90" fill="#58d1b3" opacity="0.3" />
  <circle cx="360" cy="360" r="90" fill="#58d1b3" opacity="0.3" />

  <!-- 1. Pencil (Top Left) -->
  <g transform="translate(30, 24) rotate(-35)">
    <rect x="0" y="0" width="10" height="32" rx="2" class="stroke-light" />
    <path d="M0,0 L5,-10 L10,0 Z" class="stroke-light" />
    <path d="M3,-6 L5,-10 L7,-6 Z" class="accent" />
    <line x1="0" y1="26" x2="10" y2="26" class="stroke-light" />
  </g>

  <!-- 2. Detective Magnifying Glass (Top Middle) -->
  <g transform="translate(150, 30)">
    <circle cx="16" cy="16" r="14" class="stroke-light" />
    <circle cx="16" cy="16" r="8" class="stroke-light" stroke-dasharray="2 3" opacity="0.25" />
    <path d="M12,10 A6,6 0 0,1 19,10" class="stroke-light" />
    <line x1="26" y1="26" x2="38" y2="38" class="stroke-light" stroke-width="3.5" />
  </g>

  <!-- 3. Question Mark / Mystery (Top Right) -->
  <g transform="translate(290, 28)">
    <path d="M6,10 A8,8 0 1,1 16,18 C13,20 12,23 12,26" class="stroke-light" stroke-width="2.5" />
    <circle cx="12" cy="33" r="2" class="accent" />
  </g>

  <!-- 4. Game Controller (Middle-Left) -->
  <g transform="translate(28, 120)">
    <rect x="4" y="6" width="46" height="26" rx="10" class="stroke-light" />
    <!-- D-pad -->
    <path d="M14,14 h6 M17,11 v6" class="stroke-light" stroke-width="2.5" />
    <!-- Buttons -->
    <circle cx="36" cy="15" r="2.2" class="accent" />
    <circle cx="41" cy="21" r="2.2" class="accent" />
  </g>

  <!-- 5. Paint Palette & Brush (Center) -->
  <g transform="translate(145, 130)">
    <!-- Palette body -->
    <path d="M15,35 C8,28 6,16 16,8 C26,0 44,5 48,16 C51,26 44,38 33,38 C28,38 26,34 22,34 C18,34 18,38 15,35 Z" class="stroke-light" />
    <circle cx="20" cy="14" r="2" class="accent" />
    <circle cx="28" cy="12" r="2" class="accent" />
    <circle cx="36" cy="16" r="2" class="accent" />
    <circle cx="32" cy="28" r="3.5" class="stroke-light" />
  </g>

  <!-- 6. Imposter / Detective Eye (Middle-Right) -->
  <g transform="translate(270, 130)">
    <path d="M4,18 Q20,4 36,18 Q20,32 4,18 Z" class="stroke-light" />
    <circle cx="20" cy="18" r="6" class="stroke-light" />
    <circle cx="20" cy="18" r="2.5" class="accent" />
    <path d="M8,10 Q20,2 32,8" class="stroke-light" opacity="0.3" />
  </g>

  <!-- 7. Lightbulb / Idea / Guess (Center-Bottom) -->
  <g transform="translate(160, 240)">
    <path d="M12,24 C8,20 6,15 6,10 A12,12 0 1,1 24,15 C22,20 20,24 16,24 Z" class="stroke-light" />
    <line x1="11" y1="27" x2="17" y2="27" class="stroke-light" />
    <line x1="12" y1="30" x2="16" y2="30" class="stroke-light" />
    <!-- Rays -->
    <line x1="14" y1="-2" x2="14" y2="-6" class="stroke-light" />
    <line x1="0" y1="10" x2="-4" y2="10" class="stroke-light" />
    <line x1="28" y1="10" x2="32" y2="10" class="stroke-light" />
  </g>

  <!-- 8. Crown / Winner (Lower Left) -->
  <g transform="translate(35, 250)">
    <path d="M6,26 L4,10 L14,18 L24,6 L34,18 L44,10 L42,26 Z" class="stroke-light" />
    <circle cx="4" cy="9" r="1.5" class="accent" />
    <circle cx="24" cy="5" r="1.8" class="accent" />
    <circle cx="44" cy="9" r="1.5" class="accent" />
  </g>

  <!-- 9. Paintbrush & Stroke (Lower Right) -->
  <g transform="translate(280, 245) rotate(25)">
    <rect x="0" y="10" width="8" height="28" rx="2" class="stroke-light" />
    <path d="M0,10 C0,4 2,0 4,0 C6,0 8,4 8,10 Z" class="accent" />
    <line x1="0" y1="14" x2="8" y2="14" class="stroke-light" />
    <!-- Small paint splash -->
    <path d="M14,6 Q20,4 24,10 Q28,8 26,14" class="stroke-light" opacity="0.3" />
  </g>

  <!-- 10. Dice with Dots (Near Center-Left) -->
  <g transform="translate(95, 80) rotate(15)">
    <rect x="0" y="0" width="22" height="22" rx="4" class="stroke-light" />
    <circle cx="6" cy="6" r="1.8" class="accent" />
    <circle cx="16" cy="6" r="1.8" class="accent" />
    <circle cx="11" cy="11" r="1.8" class="accent" />
    <circle cx="6" cy="16" r="1.8" class="accent" />
    <circle cx="16" cy="16" r="1.8" class="accent" />
  </g>

  <!-- 11. Footprints / Clues (Near Center-Right) -->
  <g transform="translate(225, 75) rotate(-20)">
    <ellipse cx="6" cy="8" rx="4" ry="6" class="accent" />
    <circle cx="4" cy="17" r="2" class="accent" />
    <ellipse cx="18" cy="14" rx="4" ry="6" class="accent" />
    <circle cx="16" cy="23" r="2" class="accent" />
  </g>

  <!-- 12. Floating Sketch Stars, Sparkles, and Geometry across canvas -->
  <!-- Sparkle 1 -->
  <g transform="translate(85, 205)">
    <path d="M8,0 L9,6 L15,7 L9,8 L8,14 L7,8 L1,7 L7,6 Z" class="accent" />
  </g>
  <!-- Sparkle 2 -->
  <g transform="translate(230, 195)">
    <path d="M6,0 L7,4 L11,5 L7,6 L6,10 L5,6 L1,5 L5,4 Z" class="accent" />
  </g>
  <!-- Sparkle 3 -->
  <g transform="translate(245, 25)">
    <circle cx="4" cy="4" r="2.2" class="accent" />
  </g>
  <!-- Small squiggle doodle -->
  <path d="M100,320 Q110,310 120,320 T140,320" class="stroke-light" />
  <path d="M220,330 Q230,320 240,330 T260,330" class="stroke-light" />

  <!-- Dotted lines and mini geometry for drawing feel -->
  <circle cx="85" cy="35" r="2.5" class="fill-light" />
  <circle cx="330" cy="100" r="3" class="fill-light" />
  <circle cx="30" cy="200" r="2.5" class="fill-light" />
  <circle cx="340" cy="210" r="2" class="fill-light" />
  <circle cx="140" cy="80" r="2" class="fill-light" />

  <!-- Checkmark / deduction mark -->
  <path d="M100,165 L106,172 L120,158" class="stroke-light" stroke-width="2" />
  <path d="M245,310 L250,316 L262,304" class="stroke-light" stroke-width="2" />
</svg>
