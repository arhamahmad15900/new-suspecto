<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" width="100%" height="100%" class="suspecto-animated-logo" role="img" aria-label="Suspecto">
  <defs>
    <!-- Mint theme gradients -->
    <linearGradient id="mintGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2FAF4" />
      <stop offset="40%" stop-color="#B8F2E6" />
      <stop offset="100%" stop-color="#4AC7A8" />
    </linearGradient>

    <linearGradient id="mintGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#B8F2E6" />
      <stop offset="100%" stop-color="#36B394" />
    </linearGradient>

    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="45%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <filter id="logoShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#07221D" flood-opacity="0.35" />
    </filter>

    <filter id="glassShine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .logo-letter {
      font-family: 'Nunito', 'Arial Rounded MT Bold', 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 88px;
      paint-order: stroke fill;
      stroke: #0E332C;
      stroke-width: 14px;
      stroke-linejoin: round;
      stroke-linecap: round;
      fill: url(#mintGrad1);
      transform-origin: center bottom;
      display: inline-block;
    }
    
    .logo-letter-alt {
      fill: url(#mintGrad2);
    }

    .letter-highlight {
      fill: #ffffff;
      opacity: 0.8;
      pointer-events: none;
    }

    /* Animation Keyframes */
    @keyframes letterPop {
      0% {
        transform: translateY(28px) scale(0.65);
        opacity: 0;
      }
      60% {
        transform: translateY(-8px) scale(1.08);
        opacity: 1;
      }
      80% {
        transform: translateY(3px) scale(0.97);
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    @keyframes glassEntrance {
      0% {
        transform: translate(470px, 60px) scale(0.3) rotate(-45deg);
        opacity: 0;
      }
      65% {
        transform: translate(470px, 60px) scale(1.15) rotate(16deg);
        opacity: 1;
      }
      85% {
        transform: translate(470px, 60px) scale(0.95) rotate(-6deg);
      }
      100% {
        transform: translate(470px, 60px) scale(1) rotate(10deg);
        opacity: 1;
      }
    }

    @keyframes gentleIdle {
      0%, 100% {
        transform: translate(470px, 60px) rotate(10deg) translateY(0);
      }
      50% {
        transform: translate(470px, 60px) rotate(14deg) translateY(-4px);
      }
    }

    @keyframes sparkleFlash {
      0%, 85%, 100% {
        opacity: 0;
        transform: scale(0.2) rotate(0deg);
      }
      90%, 95% {
        opacity: 1;
        transform: scale(1.1) rotate(45deg);
      }
    }

    @keyframes letterIdleWave {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    /* Staggered entrance applied to letters */
    .l-1 { animation: letterPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.05s both; }
    .l-2 { animation: letterPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.12s both; }
    .l-3 { animation: letterPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.19s both; }
    .l-4 { animation: letterPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.26s both; }
    .l-5 { animation: letterPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.33s both; }
    .l-6 { animation: letterPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.40s both; }
    .l-7 { animation: letterPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.47s both; }
    .l-8 { animation: letterPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.54s both; }

    .logo-glass-group {
      animation: glassEntrance 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.62s both,
                 gentleIdle 4s ease-in-out 1.4s infinite;
      transform-origin: 0 0;
    }

    .sparkle {
      animation: sparkleFlash 6s ease-in-out 2s infinite;
      transform-origin: center;
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .l-1, .l-2, .l-3, .l-4, .l-5, .l-6, .l-7, .l-8, .logo-glass-group, .sparkle {
        animation: none !important;
        opacity: 1 !important;
        transform: translate(470px, 60px) rotate(10deg) !important;
      }
      .l-1, .l-2, .l-3, .l-4, .l-5, .l-6, .l-7, .l-8 {
        transform: none !important;
      }
    }
  </style>

  <!-- Group with filter shadow -->
  <g filter="url(#logoShadow)">

    <!-- Letter 1: S -->
    <g class="l-1">
      <text x="28" y="94" class="logo-letter">S</text>
      <!-- Specular gloss pill -->
      <path d="M42,42 C48,36 60,36 68,40" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.8" />
    </g>

    <!-- Letter 2: u -->
    <g class="l-2">
      <text x="88" y="94" class="logo-letter logo-letter-alt">u</text>
      <path d="M98,54 C100,68 100,76 104,80" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75" />
    </g>

    <!-- Letter 3: s -->
    <g class="l-3">
      <text x="142" y="94" class="logo-letter">s</text>
      <path d="M152,52 C158,47 168,48 174,52" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.75" />
    </g>

    <!-- Letter 4: p -->
    <g class="l-4">
      <text x="194" y="94" class="logo-letter logo-letter-alt">p</text>
      <path d="M214,48 C222,46 230,48 234,54" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
    </g>

    <!-- Letter 5: e -->
    <g class="l-5">
      <text x="252" y="94" class="logo-letter">e</text>
      <path d="M264,48 C274,45 284,47 290,52" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
    </g>

    <!-- Letter 6: c -->
    <g class="l-6">
      <text x="306" y="94" class="logo-letter logo-letter-alt">c</text>
      <path d="M320,48 C330,45 338,47 344,52" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
    </g>

    <!-- Letter 7: t -->
    <g class="l-7">
      <text x="356" y="94" class="logo-letter">t</text>
      <path d="M362,40 C364,52 364,70 366,78" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.75" />
    </g>

    <!-- Letter 8: o -->
    <g class="l-8">
      <text x="398" y="94" class="logo-letter logo-letter-alt">o</text>
      <path d="M412,48 C420,44 430,46 436,52" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85" />
    </g>

    <!-- Detective Magnifying Glass Component -->
    <g class="logo-glass-group">
      <!-- Handle -->
      <path d="M-8,18 L-22,48 C-25,54 -19,60 -13,57 L16,28 Z" fill="url(#handleGrad)" stroke="#0E332C" stroke-width="7" stroke-linejoin="round" />
      <rect x="-8" y="20" width="12" height="6" rx="3" fill="#FCD34D" stroke="#0E332C" stroke-width="3" transform="rotate(-40 -2 23)" />

      <!-- Glass Rim Outer -->
      <circle cx="0" cy="0" r="28" fill="#4AC7A8" stroke="#0E332C" stroke-width="9" />
      <!-- Glass Rim Inner Accent -->
      <circle cx="0" cy="0" r="23" fill="#B8F2E6" />
      <!-- Glass Lens -->
      <circle cx="0" cy="0" r="19" fill="url(#lensGrad)" stroke="#0E332C" stroke-width="4" />

      <!-- Specular Gloss Arc on Lens -->
      <path d="M-12,-8 A14,14 0 0,1 8,-12" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.85" />
      <circle cx="10" cy="8" r="2.5" fill="#ffffff" opacity="0.7" />

      <!-- Detective Sparkle Glint -->
      <g class="sparkle" transform="translate(12, -14)">
        <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#ffffff" filter="url(#glassShine)" />
      </g>
    </g>

  </g>
</svg>
